name: XRPL 24/7 Scanner
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install xrpl ws
      - name: Run Scanner
        run: node scanner.js
      - name: Commit findings
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add hallazgos_reales.txt
          git commit -m "chore: auto-update hallazgos encontrados" || echo "No hay hallazgos nuevos"
          git push
