name: XRPL Engine Persistent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-xrpl-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias criptográficas
        run: pip install ecdsa base58

      - name: Ejecutar motor XRPL
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xrpl_engine.py

      - name: Sincronizar estado en Git
        run: |
          git config --global user.name "XRPL-Bot-Persistente"
          git config --global user.email "xrpl-bot@github.com"
          git pull --rebase || echo "Sin cambios remotos"
          git add state_xrpl.txt FOUND_XRPL.txt || true
          git commit -m "chore: actualizar estado XRPL automatico" || echo "Sin cambios para commitear"
          git push || echo "Push omitido"
