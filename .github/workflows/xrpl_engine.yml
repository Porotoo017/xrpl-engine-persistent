name: XRPL Engine Persistent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-xrpl-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar motor XRPL
        run: python xrpl_engine.py
      - name: Sincronizar estado en Git
        run: |
          git config --global user.name "XRPL-Bot-Persistente"
          git config --global user.email "xrpl-bot@github.com"
          git add .
          git commit -m "chore: log de ejecucion" || echo "Sin cambios"
          git push || echo "Push omitido"
