name: XRPL Engine Persistent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  run-xrpl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar monitor real XRP / XRPL
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xrpl_engine.py

      - name: Guardar estado actualizado
        run: |
          git config --global user.name "XRPL-Monitor-Bot"
          git config --global user.email "bot@xrpl-monitor.local"
          git add engine_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): actualizar estado XRPL [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          else
            echo "Sin cambios en engine_state.json"
          fi
